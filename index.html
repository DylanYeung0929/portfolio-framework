<!doctype html>
<html lang="zh-Hant">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="theme-color" content="#232323" />
    <meta name="description" content="暗色编辑部风个人作品集框架——章节幕布、液态玻璃、访客码门禁与照片策展 API。" />
    <title>Portfolio Framework</title>
    <link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='7' fill='%23232323'/%3E%3Cpath d='M9 23V9h3.2l3.8 6.4L19.8 9H23v14h-2.6V13.6L16.6 20h-1.2L11.6 13.6V23z' fill='%23e1e1e1'/%3E%3C/svg%3E" />
    <link rel="preload" href="/fonts/josefin-sans-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/kalnia-latin.woff2" as="font" type="font/woff2" crossorigin />
    <link rel="preload" href="/fonts/pacifico-latin.woff2" as="font" type="font/woff2" crossorigin />
    <script>
      (function () {
        // 首帧前定主题，避免闪白/闪黑；键名与 useTheme.ts 保持一致
        var mode = "dark";
        try {
          var saved = localStorage.getItem("pf-theme");
          if (saved === "light" || saved === "dark") mode = saved;
        } catch (e) {}
        document.documentElement.dataset.theme = mode;
        var meta = document.querySelector('meta[name="theme-color"]');
        if (meta) meta.setAttribute("content", mode === "dark" ? "#232323" : "#e1e1e1");
      })();
    </script>
  </head>
  <body><div id="root"></div><script type="module" src="/src/main.tsx"></script></body>
</html>
